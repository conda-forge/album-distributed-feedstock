{% set name = "album-distributed" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/album_distributed-{{ version }}.tar.gz
  sha256: 78d4d10b8735f764d877cc7d6deed341ce1c5833acafdcbe6c7828b293956b14

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=42
  run:
    - python >={{ python_min }}
    - album >=0.12.0,<0.13.0

test:
  imports:
    - album
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://album.solutions
  summary: album plugin for running a solution repeatedly and distributed
  dev_url: https://gitlab.com/album-app/plugins/album-distributed
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jpalbrecht
