{% set name = "album-distributed" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/album_distributed-{{ version }}.tar.gz
  sha256: 2b829f0176951c8d9734b371c4d8380bec23d805d33cafc5a3ff1c470f26a073

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=42
  run:
    - python >={{ python_min }}
    - album >=1.0.0,<2.0.0

test:
  imports:
    - album
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://album.solutions
  summary: album plugin for running a solution repeatedly and distributed
  dev_url: https://gitlab.com/album-app/plugins/album-distributed
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jpalbrecht
